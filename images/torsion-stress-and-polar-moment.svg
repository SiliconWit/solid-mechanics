<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 440" width="1010" height="440">
<rect width="1010" height="440" fill="white"/>
<text x="210.0" y="32.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(a) Shear stress varies linearly with radius</text>
<circle cx="210.0" cy="200.0" r="96.0" fill="#9aa4ad" stroke="#000" stroke-width="2.0"/>
<circle cx="210.0" cy="200.0" r="2.5" fill="#000" stroke="#000" stroke-width="0"/>
<circle cx="210.0" cy="200.0" r="32.0" fill="none" stroke="#fff" stroke-width="1.0" stroke-dasharray="4,4"/>
<circle cx="210.0" cy="200.0" r="64.0" fill="none" stroke="#fff" stroke-width="1.0" stroke-dasharray="4,4"/>
<polygon points="210.0,200.0 306.0,200.0 306.0,126.0" fill="#1a4fd6" fill-opacity="0.3" stroke="#1a4fd6" stroke-width="1.4"/>
<line x1="210.0" y1="200.0" x2="306.0" y2="126.0" stroke="#1a4fd6" stroke-width="2.2"/>
<line x1="241.7" y1="200.0" x2="241.7" y2="182.6" stroke="#1a4fd6" stroke-width="1.6"/>
