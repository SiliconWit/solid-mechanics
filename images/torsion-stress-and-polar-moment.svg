<line x1="273.4" y1="200.0" x2="273.4" y2="158.2" stroke="#1a4fd6" stroke-width="1.6"/>
<polygon points="273.4,151.2 276.8,158.2 270.0,158.2" fill="#1a4fd6" fill-opacity="1.0" stroke="#1a4fd6" stroke-width="0"/>
<line x1="306.0" y1="200.0" x2="306.0" y2="133.0" stroke="#1a4fd6" stroke-width="1.6"/>
<polygon points="306.0,126.0 309.4,133.0 302.6,133.0" fill="#1a4fd6" fill-opacity="1.0" stroke="#1a4fd6" stroke-width="0"/>
<text x="318.0" y="126.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a4fd6" text-anchor="start" font-weight="normal">τ<tspan baseline-shift="sub" font-size="9">max</tspan></text>
<text x="230.0" y="226.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="start" font-weight="normal">τ = 0 at the centre</text>
<line x1="218.0" y1="324.0" x2="298.0" y2="324.0" stroke="#000" stroke-width="1.2"/>
<polygon points="306.0,324.0 298.0,327.4 298.0,320.6" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="0"/>
<polygon points="210.0,324.0 218.0,320.6 218.0,327.4" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="0"/>
<rect x="245.0" y="314.0" width="26" height="20" fill="white"/>
<text x="258.0" y="329.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">r</text>
<text x="135.1" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="start" font-weight="normal">ρ = distance from the axis</text>
<text x="159.3" y="378.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a4fd6" text-anchor="start" font-weight="bold">τ(ρ) = T ρ / J</text>
<text x="210.0" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">the outer fibre works hardest; the core carries almost nothing</text>
<line x1="452.0" y1="60.0" x2="452.0" y2="420.0" stroke="#ccc" stroke-width="1.2"/>
<text x="690.0" y="32.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#000" text-anchor="middle" font-weight="bold">(b) Where J comes from: an annular element</text>
<circle cx="690.0" cy="200.0" r="96.0" fill="#eef1f3" stroke="#000" stroke-width="2.0"/>
<circle cx="690.0" cy="200.0" r="67.0" fill="none" stroke="#d9b45a" stroke-width="14"/>
<circle cx="690.0" cy="200.0" r="67.0" fill="none" stroke="#8a6d24" stroke-width="1.0"/>
<circle cx="690.0" cy="200.0" r="53.0" fill="none" stroke="#8a6d24" stroke-width="1.0"/>
<line x1="690.0" y1="200.0" x2="739.1" y2="165.6" stroke="#000" stroke-width="1.2"/>
<text x="716.0" y="176.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" text-anchor="start" font-weight="normal" font-style="italic">ρ</text>
<line x1="818.0" y1="104.0" x2="737.5" y2="144.1" stroke="#8a6d24" stroke-width="1.2"/>
<polygon points="731.2,147.2 736.0,141.0 739.0,147.1" fill="#8a6d24" fill-opacity="1.0" stroke="#8a6d24" stroke-width="0"/>
<text x="822.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a6d24" text-anchor="start" font-weight="normal">ring of radius ρ,</text>
<text x="822.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a6d24" text-anchor="start" font-weight="normal">width dρ</text>
<line x1="698.0" y1="324.0" x2="778.0" y2="324.0" stroke="#000" stroke-width="1.2"/>
<polygon points="786.0,324.0 778.0,327.4 778.0,320.6" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="0"/>
<polygon points="690.0,324.0 698.0,320.6 698.0,327.4" fill="#000" fill-opacity="1.0" stroke="#000" stroke-width="0"/>
<rect x="725.0" y="314.0" width="26" height="20" fill="white"/>
<text x="738.0" y="329.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000" text-anchor="middle" font-weight="normal" font-style="italic">r</text>
<text x="822.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8a6d24" text-anchor="start" font-weight="bold">dA = 2πρ dρ</text>
<text x="549.6" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#000" text-anchor="start" font-weight="normal">J = ∫ ρ² dA   (add up every ring, 0 to r)</text>
<text x="588.6" y="380.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a4fd6" text-anchor="start" font-weight="bold">J = π d<tspan dy="-6" font-size="9">4</tspan> / 32   (solid shaft)</text>
<text x="690.0" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">each ring contributes its area times the square of its radius</text>
</svg>