<text x="755.0" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="middle" font-weight="normal">the load is shared by TWO sections of the pin</text>
<circle cx="700.0" cy="320.0" r="30.0" fill="#d9b45a" stroke="#000" stroke-width="1.8"/>
<circle cx="772.0" cy="320.0" r="30.0" fill="#d9b45a" stroke="#000" stroke-width="1.8"/>
