<text x="812.0" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal">= 2A total</text>
<text x="584.4" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1a4fd6" text-anchor="start" font-weight="bold">τ = F / 2A   (half the single-shear stress)</text>
</svg>